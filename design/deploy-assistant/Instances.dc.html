<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Instances</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&amp;display=swap">
<style>
body{margin:0}
a{color:#ff995c}a:hover{color:#ffb98f}
button{font:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; background: #0f0e0e; color: #eeeae7; font-family: 'Roboto Flex', system-ui, sans-serif;">
<nav aria-label="Sections" style="width: 232px; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px; background: #181615; border-right: 1px solid #302b29;">
<div style="display: flex; flex-direction: column; padding: 0 8px 20px;"><strong style="font-size: 15px;">Material QEMU</strong><span style="font-size: 12px; color: #ada6a1;">Deploy Assistant</span></div>
<a href="Main.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 22px; color: #ada6a1; text-decoration: none;">Deploy</a>
<a href="Instances.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 22px; background: #482612; color: #eeeae7; text-decoration: none; font-weight: 600;">Instances</a>
</nav>
<main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 20px;">
<header style="display: flex; align-items: center; gap: 16px;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0; font-size: 30px; font-weight: 600;">Instances</h1>
<p style="margin: 0; color: #ada6a1; font-size: 14px;">Only virtual machines this app created are listed. Health is checked when you open this page or press Refresh.</p>
</div>
<button type="button" style="height: 44px; padding: 0 20px; border-radius: 22px; border: 1px solid #5c5651; background: transparent; color: #eeeae7;">Refresh</button>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 22px; background: {{accent}}; color: #1a1817; font-weight: 700; text-decoration: none;">New deployment</a>
</header>
<div style="display: flex; flex-direction: column; gap: 12px;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<article style="display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 16px; background: #181615; border: 1px solid #302b29; flex-wrap: wrap;">
<span style="{{r.dot}}" aria-hidden="true"></span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 200px;">
<strong style="font-size: 16px;">{{r.name}}</strong>
<span style="font-size: 13px; color: #ada6a1;">{{r.hv}} · {{r.version}}</span>
</div>
<span style="font-size: 13px; min-width: 150px;">{{r.health}}</span>
<span style="font-size: 14px; flex-grow: 1; color: #ff995c;">{{r.url}}</span>
<button type="button" onClick="{{r.toggle}}" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #5c5651; background: transparent; color: #eeeae7;">{{r.toggleLabel}}</button>
<button type="button" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #5c5651; background: transparent; color: #eeeae7;">Restart</button>
<button type="button" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #5c5651; background: transparent; color: #eeeae7;">Copy link</button>
<a href="Remove.dc.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #8a5550; color: #ff9a93; text-decoration: none;">Remove</a>
</article>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff995c","options":["#ff995c","#5eead4","#9ab4ff"]},"motion":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { off: { 'material-qemu-lab': true } }; }
  renderVals() {
    const accent = this.props.accent ?? '#ff995c';
    const motion = this.props.motion ?? true;
    const base = [
      { name: 'material-qemu-1', hv: 'VMware Workstation', version: 'v0.1.0-build.42', url: 'http://192.168.50.141:8080/' },
      { name: 'material-qemu-test', hv: 'Oracle VirtualBox', version: 'v0.1.0-build.41', url: 'http://192.168.50.152:8080/' },
      { name: 'material-qemu-lab', hv: 'Oracle VirtualBox', version: 'v0.1.0-build.40', url: 'Last seen http://192.168.50.163:8080/' }
    ];
    const rows = base.map((r) => {
      const off = Boolean(this.state.off[r.name]);
      return { ...r, health: off ? 'Stopped' : 'Healthy, checked 19:44',
        dot: 'width:12px;height:12px;border-radius:6px;flex:none;background:' + (off ? '#5c5651' : '#5eead4') + ';' + (motion ? 'transition:background 200ms;' : ''),
        toggleLabel: off ? 'Start' : 'Stop',
        toggle: () => this.setState({ off: { ...this.state.off, [r.name]: !off } }) };
    });
    return { accent, rows };
  }
}
</script>
</body>
</html>
