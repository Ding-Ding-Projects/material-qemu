<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deploy wizard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,400..900&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#ff995c}a:hover{color:#ffb98f}
button{font:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; background: #0d0c0b; color: #ece6e1; font-family: 'Roboto Flex', system-ui, sans-serif;">
<nav aria-label="Sections" style="width: 208px; box-sizing: border-box; padding: 28px 0; display: flex; flex-direction: column; background: #141210; border-right: 1px solid #2a2522;">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 24px 28px;">
<span style="font-family: 'Roboto Mono', monospace; font-size: 11px; letter-spacing: .12em; color: {{accent}};">MATERIAL QEMU</span>
<strong style="font-size: 22px; font-weight: 800; font-stretch: 70%; text-transform: uppercase;">Deploy</strong>
</div>
<a href="Main.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 24px 0 21px; color: #ece6e1; text-decoration: none; font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: .08em; border-left: 3px solid {{accent}}; background: #1c1916;">01 DEPLOY</a>
<a href="Instances.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 24px; color: #a39a93; text-decoration: none; font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: .08em;">02 RACK</a>
<a href="Flash.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 24px; color: #a39a93; text-decoration: none; font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: .08em;">03 FLASH</a>
<div style="flex-grow: 1;"></div>
<label style="display: flex; flex-direction: column; gap: 6px; padding: 0 24px; font-family: 'Roboto Mono', monospace; font-size: 11px; letter-spacing: .12em; color: #a39a93;">LANGUAGE<select style="height: 36px; border-radius: 3px; border: 1px solid #4a423d; background: #0d0c0b; color: #ece6e1;"><option>English</option><option>粵語</option><option>English + 粵語</option></select></label>
</nav>
<main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 22px;">
<header style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-family: 'Roboto Mono', monospace; font-size: 12px; letter-spacing: .14em; color: #a39a93;">NEW UNIT · ONE CLICK FROM IMAGE TO LAN LINK</span>
<h1 style="margin: 0; font-size: 44px; line-height: 1; font-weight: 800; font-stretch: 62%; text-transform: uppercase;">Rack a new Material QEMU</h1>
</header>
<section aria-labelledby="t1" style="display: flex; flex-direction: column; gap: 10px;">
<h2 id="t1" style="margin: 0; font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: .14em; color: #a39a93;">01 · HOST</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
<sc-for list="{{hosts}}" as="h" hint-placeholder-count="3">
<button type="button" onClick="{{h.pick}}" aria-pressed="{{h.pressed}}" disabled="{{h.off}}" style="{{h.card}}">
<span style="display: flex; align-items: center; justify-content: space-between; width: 100%;"><strong style="font-size: 22px; font-weight: 800; font-stretch: 62%; text-transform: uppercase;">{{h.name}}</strong><span style="{{h.led}}"></span></span>
<span style="font-family: 'Roboto Mono', monospace; font-size: 12px; color: #a39a93;">{{h.detail}}</span>
<span style="font-family: 'Roboto Mono', monospace; font-size: 11px; letter-spacing: .1em; color: {{h.statusColor}};">{{h.status}}</span>
</button>
</sc-for>
</div>
</section>
<section aria-labelledby="t2" style="display: flex; flex-direction: column; gap: 10px;">
<h2 id="t2" style="margin: 0; font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: .14em; color: #a39a93;">02 · IMAGE</h2>
<div style="display: flex; gap: 20px; align-items: center; padding: 14px 16px; border: 1px solid #36302b; border-radius: 3px; background: #141210; font-family: 'Roboto Mono', monospace; font-size: 13px;">
<label style="display: flex; gap: 8px; align-items: center;"><input type="radio" name="src" checked> v0.1.0-build.6 · 1.4 GB · SHA-256 CHECKED</label>
<label style="display: flex; gap: 8px; align-items: center; color: #a39a93;"><input type="radio" name="src"> LOCAL .OVA</label>
</div>
</section>
<section aria-labelledby="t3" style="display: flex; flex-direction: column; gap: 10px;">
<h2 id="t3" style="margin: 0; font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: .14em; color: #a39a93;">03 · UNIT</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;">
<label style="display: flex; flex-direction: column; gap: 6px; font-family: 'Roboto Mono', monospace; font-size: 11px; letter-spacing: .12em; color: #a39a93;">NAME<input value="material-qemu-1" style="height: 44px; padding: 0 12px; border-radius: 3px; border: 1px solid #4a423d; background: #0d0c0b; color: #ece6e1; font: 15px 'Roboto Mono', monospace;"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: 'Roboto Mono', monospace; font-size: 11px; letter-spacing: .12em; color: #a39a93;">CPUS<input value="4" style="height: 44px; padding: 0 12px; border-radius: 3px; border: 1px solid #4a423d; background: #0d0c0b; color: #ece6e1; font: 15px 'Roboto Mono', monospace;"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: 'Roboto Mono', monospace; font-size: 11px; letter-spacing: .12em; color: #a39a93;">MEMORY MB<input value="8192" style="height: 44px; padding: 0 12px; border-radius: 3px; border: 1px solid #4a423d; background: #0d0c0b; color: #ece6e1; font: 15px 'Roboto Mono', monospace;"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: 'Roboto Mono', monospace; font-size: 11px; letter-spacing: .12em; color: #a39a93;">BRIDGE<select style="height: 44px; padding: 0 12px; border-radius: 3px; border: 1px solid #4a423d; background: #0d0c0b; color: #ece6e1; font: 14px 'Roboto Mono', monospace;"><option>Intel(R) Ethernet</option></select></label>
</div>
</section>
<div style="flex-grow: 1;"></div>
<footer style="display: flex; gap: 16px; align-items: center; padding-top: 16px; border-top: 1px solid #2a2522;">
<span style="flex-grow: 1; font-family: 'Roboto Mono', monospace; font-size: 12px; color: #7d746d;">THE UNIT GETS ITS OWN LAN ADDRESS · NOTHING IS EXPOSED TO THE INTERNET</span>
<a href="Deploying.dc.html" style="display: inline-flex; align-items: center; height: 52px; padding: 0 28px; border-radius: 3px; background: {{accent}}; color: #170f0a; font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 500; letter-spacing: .1em; text-decoration: none;">RACK IT ON {{chosen}} →</a>
</footer>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff995c","options":["#ff995c","#5eead4","#9ab4ff"]},"motion":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 'vmware' }; }
  renderVals() {
    const accent = this.props.accent ?? '#ff995c';
    const motion = this.props.motion ?? true;
    const list = [
      { id: 'virtualbox', name: 'VirtualBox', detail: 'VBoxManage 7.2.22', ok: true },
      { id: 'vmware', name: 'VMware', detail: 'vmrun + OVF Tool', ok: true },
      { id: 'docker', name: 'Docker here', detail: 'engine not running', ok: false }
    ];
    const hosts = list.map((h) => {
      const on = this.state.pick === h.id;
      return { ...h, pressed: String(on), off: !h.ok, pick: () => this.setState({ pick: h.id }),
        status: h.ok ? 'READY' : 'START DOCKER DESKTOP, THEN REFRESH', statusColor: h.ok ? '#5eead4' : '#ff9a93',
        led: 'width:10px;height:10px;border-radius:5px;background:' + (h.ok ? '#5eead4' : '#3a3430') + ';' + (h.ok ? 'box-shadow:0 0 8px #5eead4;' : ''),
        card: 'display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:16px 18px;border-radius:3px;color:#ece6e1;cursor:' + (h.ok ? 'pointer' : 'not-allowed') + ';opacity:' + (h.ok ? 1 : .6) + ';background:' + (on ? '#22170f' : '#141210') + ';border:1px solid ' + (on ? accent : '#36302b') + ';box-shadow:' + (on ? 'inset 3px 0 0 ' + accent : 'none') + ';' + (motion ? 'transition:background 160ms,border-color 160ms;' : '') };
    });
    return { accent, hosts, chosen: { vmware: 'VMWARE', docker: 'DOCKER', virtualbox: 'VIRTUALBOX' }[this.state.pick] };
  }
}
</script>
</body>
</html>
