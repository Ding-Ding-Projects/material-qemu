<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pull unit arming panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,400..900&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#ff995c}a:hover{color:#ffb98f}
button{font:inherit}
@keyframes mqcrawl{from{background-position:0 0}to{background-position:28px 0}}
@keyframes mqdone{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: rgba(6,5,5,.9); color: #ece6e1; font-family: 'Roboto Flex', system-ui, sans-serif;">
<div role="dialog" aria-labelledby="pt" aria-describedby="pd" style="width: 640px; box-sizing: border-box; background: #1a1715; border: 1px solid #4a2420; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column;">
<div aria-hidden="true" style="height: 14px; background: repeating-linear-gradient(-45deg, {{danger}} 0 10px, #1a1715 10px 20px);"></div>
<div style="padding: 28px 32px; display: flex; flex-direction: column; gap: 18px;">
<span style="font-family: 'Roboto Mono', monospace; font-size: 12px; letter-spacing: .16em; color: {{danger}};">DESTRUCTIVE ACTION · CANNOT BE UNDONE</span>
<h1 id="pt" style="margin: 0; font-size: 40px; line-height: 1; font-weight: 800; font-stretch: 62%; text-transform: uppercase;">Pull material-qemu-test</h1>
<p id="pd" style="margin: 0; font-size: 15px; line-height: 1.5; color: #c9c0b9;">Powers off and deletes the VirtualBox machine <strong>material-qemu-test</strong> and its disk files, with every QEMU guest, ISO and setting stored inside it.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="2">
<button type="button" aria-pressed="{{k.pressed}}" onClick="{{k.turn}}" style="display: flex; align-items: center; gap: 16px; padding: 14px 16px; background: #0d0c0b; border: 1px solid {{k.border}}; border-radius: 4px; color: #ece6e1; cursor: pointer; text-align: left;">
<span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 28px; flex: none; display: flex; align-items: center; justify-content: center; background: #2a2522; border: 3px solid {{k.border}};"><span style="{{k.slot}}"></span></span>
<span style="display: flex; flex-direction: column; gap: 4px;"><span style="font-family: 'Roboto Mono', monospace; font-size: 11px; letter-spacing: .14em; color: #a39a93;">{{k.label}}</span><strong style="font-size: 20px; font-weight: 800; font-stretch: 62%; letter-spacing: .04em; color: {{k.stateColor}};">{{k.state}}</strong></span>
</button>
</sc-for>
</div>
<label style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-family: 'Roboto Mono', monospace; font-size: 12px; letter-spacing: .12em; color: #a39a93;">{{sliderLabel}}</span>
<span style="{{track}}"><span style="{{fill}}"></span></span>
<input type="range" min="0" max="100" value="{{slide}}" disabled="{{locked}}" onInput="{{onSlide}}" aria-valuetext="{{slide}} percent" style="width: 100%; margin: -36px 0 0; height: 36px; opacity: .001; cursor: {{cursor}};">
</label>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<p role="status" style="{{doneStyle}}">AUTHORIZED · PULLING UNIT…</p>
</sc-if>
<div style="display: flex; justify-content: flex-end;">
<a href="Instances.dc.html" style="display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border: 1px solid #4a423d; border-radius: 4px; color: #ece6e1; text-decoration: none; font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: .1em;">EMERGENCY EXIT · ESC</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"danger":{"editor":"color","default":"#ff6b5e","options":["#ff6b5e","#ff9a93","#ffb020"]},"motion":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { k: [false, false], slide: 0 }; }
  renderVals() {
    const danger = this.props.danger ?? '#ff6b5e';
    const motion = this.props.motion ?? true;
    const { k, slide } = this.state;
    const armed = k[0] && k[1];
    const done = armed && slide >= 100;
    const keys = [0, 1].map((i) => ({
      label: 'KEY ' + (i + 1), pressed: String(k[i]), state: k[i] ? 'ARMED' : 'SAFE',
      stateColor: k[i] ? danger : '#ece6e1', border: k[i] ? danger : '#4a423d',
      slot: 'display:block;width:6px;height:30px;border-radius:3px;background:' + (k[i] ? danger : '#ece6e1') + ';transform:rotate(' + (k[i] ? 90 : 0) + 'deg);' + (motion ? 'transition:transform 260ms cubic-bezier(.3,1.6,.5,1),background 200ms;' : ''),
      turn: () => { const n = [...k]; n[i] = !n[i]; this.setState({ k: n, slide: 0 }); },
    }));
    return { danger, keys, slide, done, locked: !armed, cursor: armed ? 'grab' : 'not-allowed',
      onSlide: (e) => this.setState({ slide: Number(e.target.value) }),
      sliderLabel: armed ? 'DRAG THE ARMING BAR ALL THE WAY TO PULL THE UNIT' : 'TURN BOTH KEYS TO ARMED TO UNLOCK THE BAR',
      track: 'display:block;height:36px;border-radius:3px;border:1px solid ' + (armed ? danger : '#36302b') + ';background:#0d0c0b;overflow:hidden;',
      fill: 'display:block;height:100%;width:' + slide + '%;background:repeating-linear-gradient(-45deg,' + danger + ' 0 10px,#3a1512 10px 20px);background-size:28px 28px;' + (motion && armed && slide > 0 && slide < 100 ? 'animation:mqcrawl 600ms linear infinite;' : ''),
      doneStyle: 'margin:0;font-family:Roboto Mono,monospace;font-size:14px;letter-spacing:.14em;color:' + danger + ';' + (motion ? 'animation:mqdone 520ms cubic-bezier(.2,0,0,1);' : '') };
  }
}
</script>
</body>
</html>
