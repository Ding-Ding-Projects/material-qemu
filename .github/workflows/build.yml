name: Build and release

# Builds the container image, the VirtualBox/VMware appliance (OVA) and the
# portable Windows deploy assistant, then publishes one normal release per run.
# No tests or lint run here by design; checks run locally before pushing.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: 0.1.0-build.${{ github.run_number }}

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/material-qemu:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=ghcr.io/${owner}/material-qemu:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: false
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Export the image for the appliance
        run: |
          docker pull "${{ steps.meta.outputs.ref }}"
          mkdir -p out
          docker save "${{ steps.meta.outputs.ref }}" | gzip -1 > out/material-qemu-image.tar.gz
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: out/material-qemu-image.tar.gz
          retention-days: 3
          compression-level: 0

  appliance:
    runs-on: ubuntu-24.04
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils qemu-system-x86 cloud-guest-utils gdisk grub-common grub-pc-bin grub-efi-amd64-bin mtools xorriso
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - uses: actions/download-artifact@v4
        with:
          name: container-image
          path: in
      - name: Build the appliance disk
        run: bash appliance/build-appliance.sh in/material-qemu-image.tar.gz "${{ needs.image.outputs.ref }}" "v${VERSION}" work
      - name: Boot check under QEMU
        run: bash appliance/boot-check.sh work/material-qemu-appliance.qcow2 logs
      - name: Package the OVA and the USB image
        run: |
          set -euo pipefail
          mkdir -p out
          # USB image: the 8 GiB disk as raw bytes; it grows to fill the drive on first boot.
          qemu-img convert -O raw work/material-qemu-appliance.qcow2 work/usb.img
          raw_sha=$(sha256sum work/usb.img | cut -d' ' -f1)
          raw_size=$(stat -c %s work/usb.img)
          gzip -1 -c work/usb.img > "out/material-qemu-usb-x86_64-${VERSION}.img.gz"
          rm work/usb.img
          printf '{"rawSha256":"%s","rawBytes":%s}\n' "$raw_sha" "$raw_size" > "out/material-qemu-usb-x86_64-${VERSION}.img.json"
          # Bare-metal installer ISO: boots, writes the same image to an internal disk and checks it.
          iso="out/material-qemu-installer-x86_64-${VERSION}.iso"
          bash appliance/build-installer-iso.sh work/material-qemu-appliance.qcow2 "out/material-qemu-usb-x86_64-${VERSION}.img.gz" "out/material-qemu-usb-x86_64-${VERSION}.img.json" "v${VERSION}" "$iso"
          printf '{"rawSha256":"%s","rawBytes":%s}\n' "$(sha256sum "$iso" | cut -d' ' -f1)" "$(stat -c %s "$iso")" > "${iso%.iso}.iso.json"
          bash appliance/install-check.sh "$iso" logs/install
          # VM disk: the same disk with a 64 GiB capacity.
          qemu-img resize work/material-qemu-appliance.qcow2 64G
          qemu-img convert -O vmdk -o subformat=streamOptimized,adapter_type=lsilogic work/material-qemu-appliance.qcow2 work/disk.vmdk
          rm work/material-qemu-appliance.qcow2
          node appliance/make-ova.mjs work/disk.vmdk 64 "v${VERSION}" "out/material-qemu-appliance-${VERSION}.ova"
          cd out
          for f in *.ova *.img.gz *.iso; do sha256sum "$f" > "$f.sha256"; done
          ls -l; cat *.sha256 *.json
      - uses: actions/upload-artifact@v4
        with:
          name: appliance
          path: out/
          retention-days: 3
          compression-level: 0
      - if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: appliance-boot-logs
          path: |
            logs/serial.log
            logs/install/install-serial.log
            logs/install/installed-boot/serial.log
          if-no-files-found: warn
          retention-days: 14

  deploy-assistant:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the portable deploy assistant
        working-directory: companion
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder --win portable --publish never "-c.extraMetadata.version=$env:VERSION"
          $exe = Get-ChildItem dist -Filter '*-portable.exe' | Select-Object -First 1
          (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $exe.Name | Set-Content -NoNewline -Encoding ascii "$($exe.FullName).sha256"
          Get-ChildItem dist -File
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-assistant
          path: |
            companion/dist/*-portable.exe
            companion/dist/*-portable.exe.sha256
          retention-days: 3

  release:
    runs-on: ubuntu-24.04
    needs: [image, appliance, deploy-assistant]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: '{appliance,deploy-assistant}'
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ needs.image.outputs.ref }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          started=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '[.jobs[].started_at] | min')
          completed=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          secs=$(( $(date -ud "$completed" +%s) - $(date -ud "$started" +%s) ))
          duration=$(printf '%02d:%02d:%02d' $((secs/3600)) $((secs%3600/60)) $((secs%60)))
          dish="No dim sum code name could be resolved for this release."
          if curl -fsSL --max-time 20 https://raw.githubusercontent.com/Ding-Ding-Projects/dim-sum-photos/main/catalog/index.json -o catalog.json; then
            used=$(gh release list -R "$GITHUB_REPOSITORY" --limit 500 --json name --jq '.[].name' || true)
            pick=$(USED="$used" node -e 'const c=require("./catalog.json");const u=process.env.USED;const d=c.dishes.find(x=>!u.includes(x.name.en));if(d)console.log(`${d.name.en} ${d.name.zhHant}`)' || true)
            if [ -n "$pick" ]; then dish="Code name: ${pick} (from the public dim sum catalog, https://github.com/Ding-Ding-Projects/dim-sum-photos; no published photo asset is available yet)."; fi
          fi
          title="Material QEMU ${VERSION}"
          if [ -n "${pick:-}" ]; then title="Material QEMU ${VERSION} · ${pick}"; fi
          cat > notes.md <<EOF
          ## Downloads

          - **material-qemu-deploy-${VERSION}-portable.exe**: one-click deploy assistant for Windows. It imports the appliance into VirtualBox or VMware Workstation, bridges it onto your network, waits for the service to report its address and checks its health. Single portable file, unsigned, so Windows may show an unknown-publisher warning.
          - **material-qemu-appliance-${VERSION}.ova**: the appliance virtual machine (Debian 13, Docker, Material QEMU preloaded). Import it into VirtualBox or VMware with a bridged network adapter; the console shows the address to open.
          - **material-qemu-usb-x86_64-${VERSION}.img.gz**: the same appliance as a raw disk image for a USB drive (8 GiB or larger). The deploy assistant's Flash page writes and verifies it; it grows to fill the drive on first boot.
          - **material-qemu-installer-x86_64-${VERSION}.iso**: bare-metal installer for an Intel or AMD PC. Write it to a USB drive with Rufus or the deploy assistant (or use it as a DVD), boot from it and it installs Material QEMU onto an internal disk, asking before it writes and checking the result against the release hash.
          - Container image: \`${IMAGE_REF}\` (digest \`${IMAGE_DIGEST}\`).

          ## Checks

          - The appliance disk was booted once under QEMU in this workflow on a throwaway 64 GiB overlay and answered \`/health\`; the shipped disk was never booted.
          - No unit tests, lint or interactive VirtualBox/VMware imports ran in this workflow.

          ${dish}

          Source commit: ${GITHUB_SHA}

          Workflow started: ${started}
          Workflow completed: ${completed}
          Workflow duration: ${duration}
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md assets/*
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,assets --jq '{isDraft,isPrerelease,tagName,assets:[.assets[]|{name,size}]}'
